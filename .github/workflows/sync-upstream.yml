name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/agegr/pi-web.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if there are changes
        id: check_changes
        run: |
          git fetch origin main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream/main into main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git merge upstream/main -m "Sync with upstream repository"
        continue-on-error: true

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin main
        continue-on-error: true

      - name: Generate new version
        if: steps.check_changes.outputs.has_changes == 'true'
        id: generate_version
        run: |
          # 读取当前版本
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Current version: $CURRENT_VERSION"
          
          # 解析并递增版本（1.2.3 -> 1.2.4）
          VERSION=$CURRENT_VERSION
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          node -e "
          const pkg = require('./package.json');
          pkg.version = '${{ steps.generate_version.outputs.new_version }}';
          require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add package.json
          git commit -m "Bump version to ${{ steps.generate_version.outputs.new_version }}"
          git push origin main

      - name: Setup Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@likeaixxx'

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm install

      - name: Publish to GitHub Packages
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git tag
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git tag -a v${{ steps.generate_version.outputs.new_version }} -m "Release v${{ steps.generate_version.outputs.new_version }}"
          git push origin v${{ steps.generate_version.outputs.new_version }}

      - name: Get commit logs
        if: steps.check_changes.outputs.has_changes == 'true'
        id: commit_logs
        run: |
          LOGS=$(git log upstream/main@{1}..upstream/main --oneline 2>/dev/null || echo "See commits from upstream")
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.generate_version.outputs.new_version }}
          name: Release v${{ steps.generate_version.outputs.new_version }}
          body: |
            # Automated Upstream Sync & NPM Publish

            **Version:** v${{ steps.generate_version.outputs.new_version }}

            **Published to:** [@likeaixxx/pi-web](https://github.com/likeaixxx/pi-web/pkgs/npm/pi-web)

            **Sync Source:** [agegr/pi-web](https://github.com/agegr/pi-web)

            **Changes from upstream:**
            ```
            ${{ steps.commit_logs.outputs.logs }}
            ```

            **Sync Time:** ${{ github.event.repository.updated_at }}

            ---
            *This release was automatically generated by syncing from the upstream repository and published to npm.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}