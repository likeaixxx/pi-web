name: Sync Upstream

on:
  schedule:
    # 每天 UTC 00:00 运行
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/agegr/pi-web.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if there are changes
        id: check_changes
        run: |
          git fetch origin main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream/main into main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git merge upstream/main -m "Sync with upstream repository"
        continue-on-error: true

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin main
        continue-on-error: true

      - name: Generate new tag
        if: steps.check_changes.outputs.has_changes == 'true'
        id: generate_tag
        run: |
          # 获取最新的 tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # 解析版本号并递增（v1.2.3 -> v1.2.4）
          VERSION=$(echo $LATEST_TAG | sed 's/v//')
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "Latest version: $LATEST_TAG"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git tag -a ${{ steps.generate_tag.outputs.new_version }} -m "Auto sync from upstream - ${{ steps.generate_tag.outputs.new_version }}"
          git push origin ${{ steps.generate_tag.outputs.new_version }}

      - name: Get commit logs
        if: steps.check_changes.outputs.has_changes == 'true'
        id: commit_logs
        run: |
          LOGS=$(git log upstream/main@{1}..upstream/main --oneline 2>/dev/null || echo "See commits from upstream")
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.new_version }}
          name: Release ${{ steps.generate_tag.outputs.new_version }}
          body: |
            # Automated Upstream Sync

            **Version:** ${{ steps.generate_tag.outputs.new_version }}

            **Sync Source:** [agegr/pi-web](https://github.com/agegr/pi-web)

            **Changes from upstream:**
            ```
            ${{ steps.commit_logs.outputs.logs }}
            ```

            **Sync Time:** ${{ github.event.repository.updated_at }}

            ---
            *This release was automatically generated by syncing from the upstream repository.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}